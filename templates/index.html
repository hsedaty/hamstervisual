<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hamster Visual</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="layout">
      <section class="hero-card intro-card">
        <div class="session-bar">
          <span class="eyebrow">Signed in as <strong>{{ matched_name }}</strong></span>
          <div class="toggle-group">
            <label class="switch">
              <input type="checkbox" id="dev-mode-toggle" />
              <span class="slider"></span>
            </label>
            <span class="toggle-label">Development mode</span>
          </div>
          <button class="sign-out-btn" id="sign-out-btn">Sign out</button>
        </div>
        <h1>Hampter pose list</h1>
        <div class="pose-list">
          <span>peace</span>
          <span>thumb up</span>
          <span>thumb down</span>
          <span>strong</span>
          <span>shh</span>
          <span>nerd</span>
          <span>love</span>
        </div>
      </section>

      <section class="hero-card stage-card">
        <div class="video-shell">
          <video id="webcam" autoplay playsinline muted></video>
          <canvas id="overlay" width="640" height="480"></canvas>
          <div class="video-badge" id="camera-status">camera booting</div>

          <div class="hero-card sticker-card live-sticker-panel">
            <div class="sticker-head">
              <p class="eyebrow">Live sticker</p>
              <p class="pose-readout"><span id="pose-name">no-face</span><span id="pose-confidence">0%</span></p>
            </div>
            <img id="sticker-image" alt="Current hamster sticker" src="{{ url_for('static', filename='stickers/no-face.jpg') }}" />
          </div>
        </div>

        <pre id="debug-panel">waiting for first frame...</pre>
        <canvas id="capture" width="640" height="480" hidden></canvas>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
