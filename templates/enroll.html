<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enroll Faces — Hamster Auth</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}" />
  </head>
  <body>
    <main class="enroll-layout">

      <header class="hero-card auth-header">
        <div class="auth-header-inner">
          <div>
            <p class="eyebrow">Hamster Visual</p>
            <h1>Enroll faces</h1>
          </div>
          <nav class="auth-nav">
            <a href="/auth" class="pill-link">Go to auth</a>
            <a href="/" class="pill-link pill-link--muted">Pose detection</a>
          </nav>
        </div>
      </header>

      <section class="hero-card enroll-upload-card">
        <p class="eyebrow">Upload reference photos</p>
        <p class="lede">Add as many clear face photos as you like. The system extracts a face encoding from each one and stores it. Only photos where a single face is clearly visible work best.</p>

        <div class="name-row">
          <label class="eyebrow" for="person-name">Person's name</label>
          <input type="text" id="person-name" class="name-input" placeholder="e.g. Alice" autocomplete="off" />
        </div>

        <label class="drop-zone" id="drop-zone" for="file-input">
          <span class="drop-zone-icon">＋</span>
          <span>Drop photos here or click to browse</span>
          <input type="file" id="file-input" accept="image/*" multiple hidden />
        </label>

        <div class="enroll-actions">
          <button class="enroll-btn enroll-btn--danger" id="clear-btn">Clear all enrolled faces</button>
          <span class="eyebrow enrolled-count-label">Enrolled: <strong id="enrolled-count">…</strong></span>
        </div>
      </section>

      <section class="hero-card enroll-log-card">
        <p class="eyebrow">Upload log</p>
        <ul class="enroll-log" id="enroll-log">
          <li class="enroll-log-empty">No uploads yet.</li>
        </ul>
      </section>

    </main>
    <script src="{{ url_for('static', filename='enroll.js') }}" defer></script>
  </body>
</html>
